    <path d="M168 182 H206 V262 H222 C238 262 248 252 258 236 L326 126 H356 V164 L276 286 C262 306 244 316 216 316 H168 Z" fill="url(#bronzeGrad)" />
    <path d="M312 248 L334 282 H388 V316 H320 C306 316 296 308 288 294 L276 274 Z" fill="url(#bronzeGrad)" />
  </g>

  <!-- Typography -->
  <text x="256" y="395" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="68" fill="#E5E0DA" letter-spacing="6">DLLOG</text>
  <text x="256" y="438" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="26" fill="#A67142" letter-spacing="10">TRANSPORTES</text>
</svg>
