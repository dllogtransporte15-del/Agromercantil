
<!DOCTYPE html>
<html lang="pt-BR" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>Agromercantil Logística</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
      (function() {
        function applyTheme() {
          const saved = localStorage.getItem('agromercantil_theme_mode') || localStorage.getItem('trancunha_theme_mode') || localStorage.getItem('transcunha_theme_mode');
          let isDark = true;
          if (saved === 'light') {
            isDark = false;
          } else if (saved === 'dark') {
            isDark = true;
          } else if (window.matchMedia) {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        }
        applyTheme();
        if (window.matchMedia) {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
            if (!localStorage.getItem('agromercantil_theme_mode') && !localStorage.getItem('trancunha_theme_mode')) {
              applyTheme();
            }
          });
        }
      })();
      if (window.tailwind) {
        tailwind.config = {
          darkMode: 'class',
          theme: {
          extend: {
            colors: {
              'primary': '#16A34A',       // Agromercantil Emerald / Agro Green
              'primary-dark': '#15803D',  // Darker Agro Green for hover
              'accent': '#F59E0B',        // Agromercantil Amber / Gold Grain Accent
              'accent-dark': '#D97706',   // Darker Amber for hover
              'secondary': '#64748B',     // Slate Gray from subtext
              'light-bg': '#F8FAFC',      // slate-50
              'light-card': '#FFFFFF',
              'dark-bg': '#04150e',       // Deep forest agro dark green (matching login page)
              'dark-card': '#061e13',     // Deep emerald glass slate (matching login page)
            },
          },
        },
      }
    }
    </script>
    <link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-light-bg dark:bg-dark-bg">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
